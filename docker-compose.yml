version: '3.8'

services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: cityzenai-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: cityzenai
      POSTGRES_PASSWORD: cityzenai_dev_2024
      POSTGRES_DB: cityzenai
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cityzenai"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
    driver: local
